services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DB: ${MONGO_DB:-nyc_flights}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "localhost", "--username", "${MONGO_INITDB_ROOT_USERNAME}", "--password", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  importer:
    build:
      context: .
      dockerfile: Dockerfile.importer
    profiles: ["import"]
    env_file: .env
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_SOURCE_DB}?authSource=${MONGO_SOURCE_DB}

  r-analysis:
    build:
      context: .
      dockerfile: Dockerfile.r
    profiles: [ "analysis" ]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_SOURCE_DB}?authSource=${MONGO_SOURCE_DB}
    volumes:
      - ./script_r:/workspace/script_r:ro
      - ./data:/workspace/data:ro
      - ./output:/workspace/output
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:

